# mcpctl configuration
# Copy to ~/.config/mcpctl/mcp-servers.yaml and edit to your needs

# Environment variable sources (loaded in order, later wins)
env_files:
  - ~/.env
  - .env

# Default settings
defaults:
  scope: global
  restart_policy: on-failure
  health_check:
    enabled: true
    interval: 30
    timeout: 5

servers:
  # ── remote servers (no local install needed) ────────────────

  github:
    type: remote
    description: "GitHub issues, PRs, code search, and repo management"
    transport: http
    requires_container: false
    deps: []
    notes: []
    mcp_config:
      type: http
      url: "https://api.githubcopilot.com/mcp"
      headers:
        Authorization: "Bearer ${GITHUB_PAT}"
    env_vars:
      - GITHUB_PAT

  context7:
    type: remote
    description: "Up-to-date, version-specific library docs to avoid hallucinated APIs"
    transport: http
    requires_container: false
    deps: []
    notes:
      - "Free API key at context7.com/dashboard for higher rate limits"
    mcp_config:
      type: http
      url: "https://mcp.context7.com/mcp"
      headers:
        Authorization: "Bearer ${CONTEXT7_API_KEY}"
    env_vars:
      - CONTEXT7_API_KEY

  deepwiki:
    type: remote
    description: "AI-powered docs and Q&A for any public GitHub repo, no auth needed"
    transport: http
    requires_container: false
    deps: []
    notes:
      - "Supports read_wiki_structure, read_wiki_contents, ask_question"
      - "Public repos only, no API key required"
    mcp_config:
      type: http
      url: "https://mcp.deepwiki.com/mcp"

  supabase:
    type: remote
    description: "Manage Supabase projects, databases, auth, storage, and edge functions"
    transport: http
    requires_container: false
    deps: []
    notes:
      - "Authenticates via OAuth on first use, no API key needed"
      - "Add ?read_only=true to URL for safe read-only access"
    mcp_config:
      type: http
      url: "https://mcp.supabase.com/mcp"

  railway:
    type: remote
    description: "Deploy, manage, and monitor Railway projects and services"
    transport: http
    requires_container: false
    deps: []
    notes:
      - "Authenticates via OAuth in browser"
      - "Also available locally via: railway setup agent"
    mcp_config:
      type: http
      url: "https://mcp.railway.com/mcp"

  # ── npm servers (npx, no install needed) ────────────────────

  filesystem:
    type: npm
    description: "Read, write, search, and manage files with configurable access paths"
    transport: stdio
    requires_container: false
    deps: []
    notes: []
    mcp_config:
      command: npx
      args:
        - -y
        - "@modelcontextprotocol/server-filesystem"
        - /path/to/your/projects
      env: {}

  sequential-thinking:
    type: npm
    description: "Step-by-step reasoning for complex problem decomposition"
    transport: stdio
    requires_container: false
    deps: []
    notes: []
    mcp_config:
      command: npx
      args:
        - -y
        - "@modelcontextprotocol/server-sequential-thinking"
      env: {}

  memory:
    type: npm
    description: "Persistent memory across sessions using knowledge graphs"
    transport: stdio
    requires_container: false
    deps: []
    notes: []
    mcp_config:
      command: npx
      args:
        - -y
        - "@modelcontextprotocol/server-memory"
      env: {}

  playwright:
    type: npm
    description: "Browser automation, screenshots, and page inspection (Chromium, Firefox, WebKit)"
    transport: stdio
    requires_container: false
    deps: []
    notes:
      - "Use --headless for CI, --browser chrome|firefox|webkit to pick engine"
    mcp_config:
      command: npx
      args:
        - -y
        - "@playwright/mcp-server"
      env: {}

  fetch:
    type: npm
    description: "HTTP GET/POST requests and URL content extraction"
    transport: stdio
    requires_container: false
    deps: []
    notes: []
    mcp_config:
      command: npx
      args:
        - -y
        - "@kazuph/mcp-fetch"
      env: {}

  chrome-devtools:
    type: npm
    description: "Inspect and control a running Chrome browser via DevTools Protocol"
    transport: stdio
    requires_container: false
    deps: []
    notes:
      - "Requires Chrome/Chromium running with remote debugging enabled"
    mcp_config:
      command: npx
      args:
        - -y
        - chrome-devtools-mcp@latest
      env: {}

  exa:
    type: npm
    description: "AI-native web search with semantic understanding and live crawling"
    transport: stdio
    requires_container: false
    deps: []
    notes:
      - "API key from exa.ai"
    mcp_config:
      command: npx
      args:
        - -y
        - exa-mcp-server
      env:
        EXA_API_KEY: "${EXA_API_KEY}"
    env_vars:
      - EXA_API_KEY

  sentry:
    type: npm
    description: "Query Sentry errors, issues, and performance data from your projects"
    transport: stdio
    requires_container: false
    deps: []
    notes: []
    mcp_config:
      command: npx
      args:
        - -y
        - "@sentry/mcp-server"
      env:
        SENTRY_AUTH_TOKEN: "${SENTRY_AUTH_TOKEN}"
    env_vars:
      - SENTRY_AUTH_TOKEN

  firecrawl:
    type: npm
    description: "Scrape, crawl, and search the web with structured data extraction"
    transport: stdio
    requires_container: false
    deps: []
    notes:
      - "API key from firecrawl.dev/app/api-keys"
      - "Free tier: scrape, search, interact (rate-limited)"
    mcp_config:
      command: npx
      args:
        - -y
        - firecrawl-mcp
      env:
        FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY}"
    env_vars:
      - FIRECRAWL_API_KEY

  # ── python servers (uvx) ────────────────────────────────────

  time:
    type: python
    description: "Current time and timezone conversion using IANA timezone names"
    transport: stdio
    requires_container: false
    deps: []
    notes: []
    mcp_config:
      command: uvx
      args:
        - mcp-server-time
      env: {}

  git:
    type: python
    description: "Git log, diff, blame, branch, and commit operations"
    transport: stdio
    requires_container: false
    deps: []
    notes: []
    mcp_config:
      command: uvx
      args:
        - mcp-server-git
      env: {}

  notion:
    type: python
    description: "Read and update Notion pages, databases, and blocks"
    transport: stdio
    requires_container: false
    deps: []
    notes: []
    mcp_config:
      command: uvx
      args:
        - mcp-server-notion
      env:
        NOTION_API_KEY: "${NOTION_API_KEY}"
    env_vars:
      - NOTION_API_KEY

  atlassian:
    type: python
    description: "Search and update Jira issues and Confluence pages"
    transport: stdio
    requires_container: false
    deps: []
    notes: []
    mcp_config:
      command: uvx
      args:
        - mcp-atlassian
      env:
        JIRA_URL: "${JIRA_URL}"
        JIRA_USERNAME: "${JIRA_USERNAME}"
        JIRA_API_TOKEN: "${JIRA_API_TOKEN}"
    env_vars:
      - JIRA_URL
      - JIRA_USERNAME
      - JIRA_API_TOKEN

  diagrams:
    type: python
    description: "Render cloud architecture (AWS/GCP/K8s), Mermaid, and PlantUML diagrams"
    transport: stdio
    requires_container: false
    deps:
      - graphviz
    notes:
      - "Info:"
      - "   @mermaid-js/mermaid-cli (npm) for render_mermaid"
      - "   java + plantuml is needed for render_plantuml"
      - "For more info: https://mcpservers.org/servers/byteoverdev/diagrams-mcp"
    mcp_config:
      command: python
      args:
        - -c
        - "from diagrams_mcp.server import mcp; mcp.run(transport='stdio')"
      env: {}
    # pip install diagrams-mcp-server

  # ── docker servers ──────────────────────────────────────────

  excalidraw:
    type: docker
    description: "Interactive whiteboard diagrams with Excalidraw canvas"
    transport: stdio
    requires_container: true
    deps: []
    notes: []
    container:
      name: mcp-excalidraw-canvas
      image: ghcr.io/yctimlin/mcp_excalidraw-canvas:latest
      ports:
        - "8006:3000"
    mcp_config:
      command: docker
      args:
        - run
        - -i
        - --rm
        - --add-host=host.docker.internal:host-gateway
        - -e
        - EXPRESS_SERVER_URL=http://host.docker.internal:8006
        - -e
        - ENABLE_CANVAS_SYNC=true
        - ghcr.io/yctimlin/mcp_excalidraw:latest
      env: {}

  postgres:
    type: docker
    description: "Run SQL queries and inspect PostgreSQL schema and data"
    transport: stdio
    requires_container: true
    deps: []
    notes: []
    container:
      name: mcp-postgres
      image: postgres:16-alpine
      ports:
        - "5432:5432"
      environment:
        POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
        POSTGRES_DB: "${POSTGRES_DB:-mydb}"
    mcp_config:
      command: npx
      args:
        - -y
        - mcp-postgres
        - "postgresql://postgres:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB:-mydb}"
      env: {}
    env_vars:
      - POSTGRES_PASSWORD

  sonarqube:
    type: docker
    description: "Run SonarQube code quality and security scans on your projects"
    transport: stdio
    requires_container: false
    deps: []
    notes: []
    mcp_config:
      command: docker
      args:
        - run
        - -i
        - --rm
        - --network=host
        - --entrypoint
        - /bin/sh
        - -v
        - /etc/pki/tls/certs/ca-bundle.crt:/usr/local/share/ca-certificates/rh-ca-bundle.crt:ro
        - -e
        - SONARQUBE_URL
        - -e
        - SONARQUBE_TOKEN
        - docker.io/mcp/sonarqube
        - -c
        - /usr/local/bin/install-certificates >&2 && exec java -jar /app/sonarqube-mcp-server.jar
      env:
        SONARQUBE_URL: "${SONARQUBE_URL}"
        SONARQUBE_TOKEN: "${SONARQUBE_TOKEN}"
    env_vars:
      - SONARQUBE_URL
      - SONARQUBE_TOKEN
