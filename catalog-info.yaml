    MCP server manager for Claude Code. Enable, disable, and configure MCP servers
    with container lifecycle management, dependency checks, and multi-scope support
    for global and project-level configurations.
  annotations:
    github.com/project-slug: savitojs/mcpctl
    backstage.io/techdocs-ref: dir:.
    backstage.io/source-location: url:https://github.com/savitojs/mcpctl/
  tags:
