    - cli
    - mcp
    - claude-code
    - ai
  links:
    - title: PyPI
      url: https://pypi.org/project/mcp-ctrl/
      icon: dashboard
    - title: GitHub
      url: https://github.com/savitojs/mcpctl
      icon: github
spec:
  type: service
  lifecycle: production
  owner: user:default/savitojs
